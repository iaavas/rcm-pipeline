services:
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data

  postgres-warehouse:
    image: postgres:15
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: rcm_warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse_db:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on: [postgres-airflow]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    entrypoint: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname admin --lastname admin --role Admin --email admin@example.com"

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./load:/opt/airflow/load
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt
    ports: ["8080:8080"]
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    volumes:
      - ./dags:/opt/airflow/dags
      - ./extract:/opt/airflow/extract
      - ./load:/opt/airflow/load
      - ./data:/opt/airflow/data
      - ./dbt:/opt/airflow/dbt
    command: scheduler

  superset:
    image: apache/superset:latest
    depends_on: [postgres-warehouse]
    environment:
      SUPERSET_SECRET_KEY: change_me_to_something_random
    ports: ["8088:8088"]
    command: >
      bash -c "superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset
      --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"

volumes:
  airflow_db:
  warehouse_db: